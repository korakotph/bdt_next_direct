services:
  postgres:
    image: postgres:16
    container_name: bdt_next_direct_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus
      POSTGRES_DB: directus
    volumes:
      - bdt_next_direct_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  directus:
    image: directus/directus:latest
    container_name: bdt_next_direct_directus
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8056:8055"
    environment:
      CORS_ENABLED: "true"
      # TODO: จำกัด CORS_ORIGIN ให้เฉพาะ domain จริง เช่น "https://example.com"
      CORS_ORIGIN: "*"
      CORS_METHODS: "GET,POST,PATCH,DELETE,OPTIONS"
      CORS_HEADERS: "Content-Type,Authorization"

      # SECURITY: เปลี่ยน KEY และ SECRET ให้เป็น random string ยาวอย่างน้อย 32 ตัวอักษร
      KEY: "supersecretkey"
      SECRET: "supersecretsecret"

      DB_CLIENT: "pg"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: directus
      # SECURITY: เปลี่ยน DB_USER และ DB_PASSWORD ก่อน deploy production
      DB_USER: directus
      DB_PASSWORD: directus

      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads

      # URL สาธารณะของ Directus — ใช้สำหรับ generate asset URL ให้ถูกต้อง
      PUBLIC_URL: http://localhost:8056

      # ชื่อ cookie เฉพาะของ project — ป้องกัน session ชนกันเมื่อรัน Directus หลาย instance
      SESSION_COOKIE_NAME: "bdt_next_direct_session_token"
      REFRESH_TOKEN_COOKIE_NAME: "bdt_next_direct_refresh_token"

      FILES_MAX_UPLOAD_SIZE: "1gb"
    volumes:
      - ./directus/uploads:/directus/uploads
      - ./directus/migrations:/directus/migrations
      - ./directus/extensions:/directus/extensions

  nextjs:
    build:
      context: ./next-app
      args:
        # ส่ง NEXT_PUBLIC_* เข้า Docker build เพื่อ bake ลง client bundle
        NEXT_PUBLIC_DIRECTUS_URL: http://localhost:8056
        NEXT_PUBLIC_BASE_PATH: ""
    container_name: bdt_next_direct_nextjs
    restart: unless-stopped
    ports:
      - "3012:3000"
    environment:
      DIRECTUS_INTERNAL_URL: http://directus:8055
      NEXT_PUBLIC_DIRECTUS_URL: http://localhost:8056
      NEXT_PUBLIC_BASE_PATH: ""
    depends_on:
      - directus

  adminer:
    image: adminer
    container_name: bdt_next_direct_adminer
    restart: unless-stopped
    ports:
      - "8057:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  bdt_next_direct_postgres_data:
