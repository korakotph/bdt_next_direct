<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDT Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
<div class="max-w-4xl mx-auto p-6 space-y-5">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-white">BDT Next Direct</h1>
      <p id="current-project-label" class="text-gray-500 text-sm mt-0.5">Container Manager</p>
    </div>
    <button onclick="loadStatus(); loadProjects();"
      class="text-gray-400 hover:text-white text-sm px-3 py-1.5 rounded border border-gray-700
             hover:border-gray-500 transition-colors">
      ↻ Refresh
    </button>
  </div>

  <!-- ═══ Projects ═══ -->
  <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">All Projects</h2>
      <button onclick="toggleNewProject()"
        class="text-xs bg-blue-800/50 hover:bg-blue-700/60 border border-blue-700/60
               hover:border-blue-500 text-blue-300 px-3 py-1.5 rounded-lg transition-colors">
        + New Project
      </button>
    </div>

    <!-- New Project Form -->
    <div id="new-project-panel" class="hidden mb-4 bg-gray-800/50 rounded-lg p-4 border border-gray-700/60">
      <div class="flex gap-3 items-end">
        <div class="flex-1 min-w-0">
          <label class="text-xs text-gray-400 block mb-1.5">ชื่อโปรเจค (ใช้เป็นชื่อโฟลเดอร์)</label>
          <input id="new-project-name" type="text" placeholder="my_website"
            class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm
                   text-white placeholder-gray-600 focus:outline-none focus:border-blue-500
                   font-mono"
            oninput="updateProjectPreview(this.value)"
            onkeydown="if(event.key==='Enter') createProject()">
          <p id="project-preview" class="text-xs text-gray-600 mt-1.5 font-mono min-h-[1.2em]"></p>
        </div>
        <button onclick="createProject()"
          class="shrink-0 bg-blue-600 hover:bg-blue-500 text-white rounded-lg px-4 py-2
                 text-sm font-medium transition-colors">
          ▶ สร้าง
        </button>
      </div>
    </div>

    <!-- Projects List -->
    <div id="projects-list">
      <span class="text-gray-600 text-sm">Loading...</span>
    </div>
  </div>

  <!-- ═══ Current Project Status ═══ -->
  <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">
      Current Project — Container Status
    </h2>
    <div id="status-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="animate-pulse bg-gray-800 rounded-lg h-16"></div>
      <div class="animate-pulse bg-gray-800 rounded-lg h-16"></div>
      <div class="animate-pulse bg-gray-800 rounded-lg h-16"></div>
      <div class="animate-pulse bg-gray-800 rounded-lg h-16"></div>
    </div>
  </div>

  <!-- ═══ Actions ═══ -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <button id="btn-setup" onclick="runAction('setup')"
      class="bg-blue-900/40 hover:bg-blue-800/50 border border-blue-700/50 hover:border-blue-600
             rounded-xl p-5 text-left transition-all disabled:opacity-40 disabled:cursor-not-allowed">
      <div class="text-2xl mb-2">⚙</div>
      <div class="font-semibold text-blue-300 mb-1">Setup / Import Data</div>
      <div class="text-xs text-blue-400/70 leading-relaxed">
        Build Next.js, เริ่ม containers, import dump.sql และ reset admin
      </div>
    </button>

    <button id="btn-export" onclick="runAction('export')"
      class="bg-emerald-900/40 hover:bg-emerald-800/50 border border-emerald-700/50 hover:border-emerald-600
             rounded-xl p-5 text-left transition-all disabled:opacity-40 disabled:cursor-not-allowed">
      <div class="text-2xl mb-2">📦</div>
      <div class="font-semibold text-emerald-300 mb-1">Export Data</div>
      <div class="text-xs text-emerald-400/70 leading-relaxed">
        Export database + uploads เป็น zip พร้อม download
      </div>
    </button>
  </div>

  <!-- ═══ Log Panel ═══ -->
  <div id="log-panel" class="hidden bg-gray-900 rounded-xl border border-gray-800 p-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold text-sm" id="log-title">Log</h2>
      <span id="log-status"
        class="text-xs px-2.5 py-1 rounded-full bg-yellow-900/50 text-yellow-400">
        Running...
      </span>
    </div>
    <pre id="log-output"
      class="bg-gray-950 rounded-lg p-4 text-xs text-green-400 h-80 overflow-y-auto
             whitespace-pre-wrap leading-relaxed font-mono"></pre>
    <div id="dl-section" class="hidden mt-4">
      <a id="dl-link" href="#" download
        class="inline-flex items-center gap-2 bg-emerald-700 hover:bg-emerald-600 text-white
               rounded-lg px-4 py-2 text-sm font-medium transition-colors">
        ⬇ Download Export
      </a>
    </div>
  </div>

  <!-- ═══ Past Exports ═══ -->
  <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Past Exports</h2>
      <button onclick="loadExports()"
        class="text-gray-500 hover:text-gray-300 text-xs transition-colors">↻</button>
    </div>
    <div id="exports-list" class="text-sm">
      <span class="text-gray-600">Loading...</span>
    </div>
  </div>

</div>

<script>
// ── constants ──────────────────────────────────────────────────────────────

const STATUS_STYLE = {
  running:    ['text-emerald-400', '●', 'bg-emerald-900/30 border-emerald-800/40'],
  exited:     ['text-gray-500',    '○', 'bg-gray-800/60 border-gray-700/40'],
  not_found:  ['text-red-400',     '✗', 'bg-red-900/20 border-red-800/30'],
  unknown:    ['text-yellow-400',  '?', 'bg-yellow-900/20 border-yellow-800/30'],
  paused:     ['text-yellow-400',  '⏸', 'bg-yellow-900/20 border-yellow-800/30'],
  restarting: ['text-blue-400',    '↻', 'bg-blue-900/20 border-blue-800/30'],
};

let currentProject = '';
let newProjectOpen = false;

// ── status ─────────────────────────────────────────────────────────────────

function loadStatus() {
  fetch('/api/status').then(r => r.json()).then(data => {
    currentProject = data.project || '';
    document.getElementById('current-project-label').textContent =
      currentProject ? `Current project: ${currentProject}` : 'Container Manager';

    const grid = document.getElementById('status-grid');
    grid.innerHTML = Object.entries(data.containers).map(([name, st]) => {
      const [cls, dot, bg] = STATUS_STYLE[st] || ['text-gray-400', '?', 'bg-gray-800/60'];
      return `
        <div class="${bg} rounded-lg p-3 border">
          <div class="flex items-center gap-1.5 mb-1.5">
            <span class="${cls} text-xs leading-none">${dot}</span>
            <span class="text-xs text-gray-400 capitalize font-medium">${name}</span>
          </div>
          <div class="text-xs font-mono ${cls}">${st}</div>
        </div>`;
    }).join('');
  }).catch(() => {});
}

// ── projects ───────────────────────────────────────────────────────────────

function loadProjects() {
  fetch('/api/projects').then(r => r.json()).then(projects => {
    const el = document.getElementById('projects-list');

    if (!projects.length) {
      el.innerHTML = '<span class="text-gray-600 text-sm">ยังไม่พบโปรเจค</span>';
      return;
    }

    el.innerHTML = projects.map(p => {
      const svcs = ['db', 'directus', 'nextjs', 'manager'];
      const dots = svcs.map(s => {
        const st = p.services[s] || 'not_found';
        const [cls, dot] = STATUS_STYLE[st] || ['text-gray-600', '○'];
        const label = s === 'db' ? 'postgres' : s;
        return `<span class="${cls} text-xs" title="${label}: ${st}">${dot}</span>`;
      }).join('');

      const isCurrent = currentProject && p.name === currentProject;
      const badge = isCurrent
        ? '<span class="text-xs bg-blue-800/60 text-blue-300 px-1.5 py-0.5 rounded ml-2">current</span>'
        : '';

      const portLinks = [];
      if (p.ports.directus)
        portLinks.push(`<a href="http://localhost:${p.ports.directus}" target="_blank"
          class="text-purple-400 hover:text-purple-300 hover:underline">:${p.ports.directus}</a>`);
      if (p.ports.nextjs)
        portLinks.push(`<a href="http://localhost:${p.ports.nextjs}" target="_blank"
          class="text-emerald-400 hover:text-emerald-300 hover:underline">:${p.ports.nextjs}</a>`);
      if (p.ports.manager)
        portLinks.push(`<a href="http://localhost:${p.ports.manager}" target="_blank"
          class="text-blue-400 hover:text-blue-300 hover:underline text-xs">mgr :${p.ports.manager}</a>`);

      return `
        <div class="flex items-center justify-between py-2.5 border-b border-gray-800 last:border-0 gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <div class="flex gap-1.5 shrink-0">${dots}</div>
            <span class="font-mono text-sm text-white truncate">${p.name}${badge}</span>
          </div>
          <div class="flex items-center gap-3 shrink-0 text-xs">
            ${portLinks.join('')}
          </div>
        </div>`;
    }).join('');
  }).catch(() => {
    document.getElementById('projects-list').innerHTML =
      '<span class="text-red-400 text-sm">ไม่สามารถโหลดได้</span>';
  });
}

function toggleNewProject() {
  newProjectOpen = !newProjectOpen;
  const panel = document.getElementById('new-project-panel');
  panel.classList.toggle('hidden', !newProjectOpen);
  if (newProjectOpen) {
    setTimeout(() => document.getElementById('new-project-name').focus(), 50);
  }
}

function updateProjectPreview(val) {
  const prefix = val.toLowerCase().replace(/[^a-z0-9_-]/g, '_')
    .replace(/_+/g, '_').replace(/^_|_$/g, '');
  const el = document.getElementById('project-preview');
  el.textContent = prefix
    ? `Containers: ${prefix}_db / ${prefix}_directus / ${prefix}_nextjs / ${prefix}_manager`
    : '';
}

function createProject() {
  const name = document.getElementById('new-project-name').value.trim();
  if (!name) return;
  openLog(`Create: ${name}`);
  fetch('/api/projects', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  })
    .then(r => r.json())
    .then(({ job_id, error }) => {
      if (error) { appendLog(`✘ ${error}`); finishLog('error'); return; }
      streamJob(job_id, () => { loadProjects(); loadStatus(); });
    })
    .catch(e => { appendLog(`✘ ${e}`); finishLog('error'); });
}

// ── action buttons ─────────────────────────────────────────────────────────

function runAction(type) {
  const btn = document.getElementById(`btn-${type}`);
  btn.disabled = true;
  openLog(type === 'setup' ? 'Setup Log' : 'Export Log');

  fetch(`/api/${type}`, { method: 'POST' })
    .then(r => r.json())
    .then(({ job_id }) => {
      streamJob(job_id, () => {
        btn.disabled = false;
        loadStatus();
        if (type === 'export') loadExports();
      });
    })
    .catch(() => { btn.disabled = false; });
}

// ── log streaming ──────────────────────────────────────────────────────────

function openLog(title) {
  document.getElementById('log-panel').classList.remove('hidden');
  document.getElementById('log-output').textContent = '';
  document.getElementById('log-title').textContent = title;
  document.getElementById('log-status').textContent = 'Running...';
  document.getElementById('log-status').className =
    'text-xs px-2.5 py-1 rounded-full bg-yellow-900/50 text-yellow-400';
  document.getElementById('dl-section').classList.add('hidden');
  document.getElementById('log-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function appendLog(msg) {
  const out = document.getElementById('log-output');
  out.textContent += msg + '\n';
  out.scrollTop = out.scrollHeight;
}

function finishLog(status) {
  const el = document.getElementById('log-status');
  if (status === 'done') {
    el.textContent = '✓ เสร็จแล้ว';
    el.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-900/50 text-emerald-400';
  } else {
    el.textContent = 'มีข้อผิดพลาด';
    el.className = 'text-xs px-2.5 py-1 rounded-full bg-red-900/50 text-red-400';
  }
}

function streamJob(job_id, onDone) {
  const es = new EventSource(`/api/stream/${job_id}`);
  es.onmessage = e => {
    const msg = JSON.parse(e.data);

    if (msg === '__DONE__') {
      es.close();
      finishLog('done');
      if (onDone) onDone();
      return;
    }

    if (typeof msg === 'string' && msg.startsWith('DOWNLOAD:')) {
      const fname = msg.slice(9);
      const dl = document.getElementById('dl-link');
      dl.href = `/api/download/${encodeURIComponent(fname)}`;
      dl.download = fname;
      dl.textContent = `⬇ Download ${fname}`;
      document.getElementById('dl-section').classList.remove('hidden');
      return;
    }

    appendLog(msg);
  };
  es.onerror = () => {
    es.close();
    finishLog('error');
    appendLog('Connection lost.');
  };
}

// ── exports ────────────────────────────────────────────────────────────────

function loadExports() {
  fetch('/api/exports').then(r => r.json()).then(files => {
    const el = document.getElementById('exports-list');
    if (!files.length) {
      el.innerHTML = '<span class="text-gray-600 text-sm">ยังไม่มี export</span>';
      return;
    }
    el.innerHTML = files.map(f => `
      <div class="flex items-center justify-between py-3 border-b border-gray-800 last:border-0">
        <div class="flex items-center gap-3 min-w-0">
          <span class="text-gray-300 text-sm truncate">${f.name}</span>
          <span class="text-gray-600 text-xs shrink-0">${f.size_mb} MB</span>
          <span class="text-gray-700 text-xs shrink-0 hidden sm:inline">${f.created}</span>
        </div>
        <a href="/api/download/${encodeURIComponent(f.name)}" download="${f.name}"
           class="shrink-0 ml-4 text-blue-400 hover:text-blue-300 text-xs px-3 py-1.5 rounded
                  border border-blue-800 hover:border-blue-600 transition-colors">
          ⬇ Download
        </a>
      </div>`).join('');
  });
}

// ── init ───────────────────────────────────────────────────────────────────

loadStatus();
loadProjects();
loadExports();
setInterval(() => { loadStatus(); loadProjects(); }, 15000);
</script>
</body>
</html>
