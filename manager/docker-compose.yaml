# Standalone Manager — deploy with:
#   HOST_PROJECTS_ROOT=/var/www BASE_PATH=/manager \
#   docker compose -f manager/docker-compose.yaml up -d --build

services:
  manager:
    build:
      context: .
    container_name: bdt_manager
    restart: unless-stopped
    ports:
      - "${MANAGER_PORT:-8090}:9090"
    environment:
      # PROJECTS_ROOT = HOST_PROJECTS_ROOT so container paths match host paths
      # This lets docker compose build/up work correctly from inside the container
      PROJECTS_ROOT: ${HOST_PROJECTS_ROOT}
      HOST_PROJECTS_ROOT: ${HOST_PROJECTS_ROOT}
      # BASE_PATH: sub-path prefix when behind a reverse proxy (e.g. /manager)
      BASE_PATH: ${BASE_PATH:-}
      # CADDY_CONTAINER: name of the Caddy container to reload after proxy changes
      CADDY_CONTAINER: ${CADDY_CONTAINER:-caddy}
      # CADDY_NETWORK: Docker network shared with Caddy
      CADDY_NETWORK: ${CADDY_NETWORK:-caddy_web}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount at the same path as host so container paths = host paths
      - ${HOST_PROJECTS_ROOT}:${HOST_PROJECTS_ROOT}
    networks:
      - caddy_web

networks:
  caddy_web:
    external: true
